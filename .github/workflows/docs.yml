name: Dokumentation

# Baut die MkDocs-Dokumentation (Theme "readthedocs") und veröffentlicht sie auf GitHub Pages.
# Einmalig nötig: im Repository unter Settings -> Pages als Quelle "GitHub Actions" wählen.

on:
  push:
    branches: [main, master, "claude/**"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read   # auch zum Laden der Release-Dateien
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      # --strict: kaputte Querverweise und fehlende Seiten lassen den Build fehlschlagen
      - run: mkdocs build --strict
      # Spiel-Downloads des neuesten Releases auf die Seite legen (falls es schon eines gibt)
      - name: Downloads des neuesten Releases einbinden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/downloads
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "Regatta-*.zip" --dir site/downloads \
            || echo "Noch kein Release vorhanden – es werden keine Downloads eingebunden."
          ls -lh site/downloads
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # veröffentlicht wird nur vom Hauptzweig; auf claude/*-Zweigen und in Pull Requests wird nur gebaut
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
