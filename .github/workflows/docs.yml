name: Dokumentation

# Baut die MkDocs-Dokumentation (Theme "readthedocs") und veröffentlicht sie auf GitHub Pages.
# Die Seite „Download“ bekommt dabei den neuesten Snapshot und das neueste feste Release (Tag v*).
# Einmalig nötig: im Repository unter Settings -> Pages als Quelle "GitHub Actions" wählen.

on:
  push:
    branches: [main, master, "claude/**"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read   # auch zum Laden der Release-Dateien
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      # Spiel-Downloads: neuester Snapshot und neuestes festes Release (falls vorhanden) nach dl/
      - name: Downloads der Releases laden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl/snapshot dl/stabil
          fetch() {   # $1 = Ordner, $2 = Tag-Filter (jq)
            TAG=$(gh release list --limit 100 --json tagName,createdAt --jq "[.[] | select(.tagName | $2)] | sort_by(.createdAt) | last | .tagName // empty") || TAG=""
            if [ -n "$TAG" ]; then
              echo "$1: $TAG"
              gh release download "$TAG" --dir "dl/$1" --pattern "Regatta-*.zip" --pattern "SHA256SUMS.txt" --pattern "VERSION.txt" || true
              echo "$TAG" > "dl/$1/TAG.txt"
            else
              echo "$1: noch kein Release"
            fi
          }
          fetch snapshot 'startswith("snapshot-")'
          fetch stabil 'startswith("v")'
          ls -lh dl/snapshot dl/stabil
      - name: Download-Seite aus den Release-Daten erzeugen
        run: python tools/make_download_page.py docs/spielen/download.md dl
      # --strict: kaputte Querverweise und fehlende Seiten lassen den Build fehlschlagen
      - run: mkdocs build --strict
      - name: Binaries auf die Seite legen
        run: |
          mkdir -p site/downloads
          cp -r dl/snapshot site/downloads/snapshot
          cp -r dl/stabil site/downloads/stabil
          du -sh site/downloads
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # veröffentlicht wird nur vom Hauptzweig; auf claude/*-Zweigen und in Pull Requests wird nur gebaut
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
