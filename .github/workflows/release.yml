name: Spiel bauen und veröffentlichen

# Baut das Spiel mit Godot für Linux, Windows und macOS und veröffentlicht die Zip-Dateien:
#   * jeder Push auf main  -> Snapshot (Vorabversion, Tag snapshot-<Datum>-<Commit>); es bleibt immer
#                             nur der neueste Snapshot erhalten
#   * Tag v* (z. B. v1.2.0) -> festes Release, bleibt dauerhaft erhalten
# Danach wird die Dokumentation neu gebaut; sie bietet die Downloads auf der Seite „Download“ an.
#
# Voraussetzung (einmalig): Settings -> Actions -> General -> Workflow permissions:
# „Read and write permissions“; Settings -> Pages -> Source: „GitHub Actions“.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"      # Engine-Version; Export-Vorlagen müssen exakt dazu passen

permissions:
  contents: write             # Releases anlegen und löschen
  actions: write              # Dokumentations-Workflow anstoßen

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true    # nur der neueste Stand eines Zweigs wird gebaut

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot und Export-Vorlagen laden (gecacht)
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot installieren
        run: |
          set -e
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-cache
          if [ ! -f ~/godot-cache/godot ]; then
            curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q godot.zip
            mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-cache/godot
          fi
          if [ ! -d ~/godot-cache/templates ]; then
            curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q templates.tpz -d tpl
            mv tpl/templates ~/godot-cache/templates
          fi
          chmod +x ~/godot-cache/godot
          sudo ln -sf ~/godot-cache/godot /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          ln -sfn ~/godot-cache/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          godot --version

      - name: Projekt importieren
        run: godot --headless --path . --import || true     # erzeugt .godot/ (Texturen, Audio)

      - name: Tests (Level-Check und Spieltest)
        run: |
          set -e
          godot --headless --path . --script res://tests/level_check.gd | tee check.log
          grep -q "ALLE OK" check.log
          godot --headless --fixed-fps 60 --path . --script res://tests/hazard_test.gd -- form | tee test.log
          grep -q "BESTANDEN" test.log

      - name: Exportieren
        run: |
          set -e
          mkdir -p build/windows build/linux build/macos dist
          godot --headless --path . --export-release "Windows Desktop" build/windows/Regatta.exe
          godot --headless --path . --export-release "Linux" build/linux/Regatta.x86_64
          godot --headless --path . --export-release "macOS" build/macos/Regatta.zip
          chmod +x build/linux/Regatta.x86_64
          (cd build/windows && zip -9 -q ../../dist/Regatta-windows.zip Regatta.exe)
          (cd build/linux && zip -9 -q ../../dist/Regatta-linux.zip Regatta.x86_64)
          cp build/macos/Regatta.zip dist/Regatta-macos.zip

      - name: Prüfsummen und Version schreiben
        run: |
          set -e
          cd dist
          sha256sum Regatta-*.zip > SHA256SUMS.txt
          {
            echo "commit=${GITHUB_SHA}"
            echo "kurz=${GITHUB_SHA::7}"
            echo "datum=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "godot=${GODOT_VERSION}"
            echo "lauf=${GITHUB_RUN_NUMBER}"
            echo "ref=${GITHUB_REF_NAME}"
          } > VERSION.txt
          cat VERSION.txt SHA256SUMS.txt
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: regatta-builds
          path: dist/*
          if-no-files-found: error

  release:
    needs: export
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4     # nötig, damit gh das Repository kennt
      - uses: actions/download-artifact@v4
        with:
          name: regatta-builds
          path: dist

      - name: Festes Release (Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Regatta $GITHUB_REF_NAME" --generate-notes \
            --notes "Spielbare Builds für Windows, Linux und macOS (Godot ${GODOT_VERSION}). Installationsanleitung: Seite „Download“ der Dokumentation."

      - name: Snapshot (jeder Push auf main) und alte Snapshots löschen
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -e
          TAG="snapshot-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          gh release create "$TAG" dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Snapshot $(date -u +%Y-%m-%d) (${GITHUB_SHA::7})" \
            --notes "Automatischer Snapshot von main, Commit ${GITHUB_SHA}. Wird beim nächsten Push durch einen neueren Snapshot ersetzt. Feste Versionen: Releases mit Tag v*."
          # nur der neueste Snapshot bleibt; getaggte Releases (v*) werden nie angefasst
          for old in $(gh release list --limit 200 --json tagName --jq '.[].tagName | select(startswith("snapshot-"))'); do
            if [ "$old" != "$TAG" ]; then
              echo "Lösche alten Snapshot $old"
              gh release delete "$old" --cleanup-tag --yes
            fi
          done

  docs:
    # Die Dokumentation holt sich neuesten Snapshot und neuestes festes Release und bietet sie zum Download an
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Dokumentation neu bauen und veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
